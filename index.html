<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Infinite Chess Runner</title>
    <link rel="stylesheet" href="style.css">
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;500;700&display=swap" rel="stylesheet">
</head>
<body>
    <div id="game-container">
        <div id="ui-layer">
            <div id="score">Score: <span id="score-val">0</span></div>
            <div id="power-indicator">Pouvoir: <span id="power-val" class="power-icon">♔</span></div>
            <div id="lives">Vies: <span id="lives-val">❤️❤️❤️</span></div>
            <div id="timer-bar-container">
                <div id="timer-bar"></div>
            </div>
        </div>
        
        <div id="board">
            <div id="scroll-layer">
                <div id="squares-layer"></div>
                <div id="pieces-layer">
                    <div id="king-piece" class="piece white">♔</div>
                </div>
            </div>
        </div>
        
        <div id="game-over-screen" class="hidden">
            <h1>Game Over</h1>
            <p>Score Final: <span id="final-score">0</span></p>
            <div style="display:flex; gap:15px; margin-top:20px;">
                <button id="restart-btn" class="action-btn primary">Rejouer</button>
                <button id="analyse-btn" class="action-btn secondary">Analyser le chemin</button>
            </div>
        </div>
    </div>
    <script src="script.js"></script>
</body>
</html>
